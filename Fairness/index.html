<!DOCTYPE html>
<html lang="zh-TW">
<head>

<title>資料偏差與模型公平性｜楠梓高中 AI 互動教學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>
<body data-lesson="Fairness">
<div class="shell">
<nav class="topline"><a class="home" href="../index.html">← 返回課程首頁</a><span>高雄市立楠梓高中 · AI 互動教學</span></nav>
<header class="hero"><span class="eyebrow">Interactive lesson / Fairness &amp; Bias</span><h1>資料偏差與模型公平性</h1><p class="lead">比較兩個群組的樣本數與漏報率，觀察整體分數如何掩蓋群組差異。</p></header>
<main>
<div class="layout">
<section class="card stage" aria-labelledby="stageTitle"><h2 id="stageTitle">互動觀察</h2><div id="stage" aria-live="polite"></div><div id="insight" class="callout"></div></section>
<aside class="card"><h2>調整參數</h2><div class="controls"><div class="control"><label for="groupB">B 組樣本比例 (%)<output id="groupBValue">30</output></label><input id="groupB" type="range" min="10" max="90" value="30" step="10"></div><div class="control"><label for="shift">B 組分數偏移（百分點）<output id="shiftValue">-15</output></label><input id="shift" type="range" min="-30" max="10" value="-15" step="5"></div><div class="control"><label for="fairThreshold">共同分類閾值 (%)<output id="fairThresholdValue">50</output></label><input id="fairThreshold" type="range" min="20" max="80" value="50" step="5"></div></div></aside>
</div>
<div class="lesson"><section class="card"><h2>核心概念</h2><ul><li>比較群組表現時，須同時看樣本數與錯誤類型；小樣本的百分比會較不穩定。</li><li>公平性沒有單一萬用指標，還須考慮資料來源、情境與錯誤代價。</li></ul></section><section class="card"><h2>閱讀圖表前</h2><p class="note">A、B 是虛構群組，分數完全為示意值；本頁不推論真實人群的能力或特徵。</p><p>延伸閱讀：<a href="https://developers.google.com/machine-learning/crash-course/fairness/identifying-bias" target="_blank" rel="noopener noreferrer">官方教學文件 ↗</a></p></section></div>
</main><footer class="footer">教學示範以理解原理為目標。數值與結果請依各頁註記解讀。</footer>
</div><script src="../lesson-assets/lessons.js" defer></script>
</body></html>
